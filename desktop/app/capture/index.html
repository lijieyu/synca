<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="screen" aria-label="Screenshot selection"></canvas>
<div id="hint" role="status"></div><div id="size" aria-live="polite"></div>
<div id="toolbar" role="toolbar" hidden>

</div><script src="geometry.cjs"></script><script src="renderer.js"></script></body></html>
