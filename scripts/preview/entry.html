<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Synca · 预发验收</title><style>body{margin:0;background:#f7f6fb;color:#292637;font:16px/1.7 system-ui;display:grid;place-items:center;min-height:100dvh}main{max-width:440px;padding:32px}small{color:#7753d4}h1{font-size:28px}p{color:#777280}button{font:inherit;padding:12px 18px;margin:8px 8px 8px 0;border:0;border-radius:12px;background:#7948ef;color:white;cursor:pointer}button:disabled{opacity:.5}#status{min-height:30px}</style><main><small>SYNCA · 预发环境</small><h1>选择一个测试账号</h1><p>使用独立测试数据，可自由验收编辑、分类、附件、语言和外观。不会影响正式账号或线上记录。</p><button data-profile="free">免费版 · 检查额度</button><button data-profile="unlimited">无限版 · 检查附件</button><p>本环境关闭 Apple 登录、真实购买与推送；外部 AI 客户端连接需单独验收。请勿存放真实个人资料。</p><p id="status" role="status"></p></main><script>
document.querySelectorAll('button').forEach(button=>button.onclick=async()=>{document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/__preview/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:button.dataset.profile})});if(!r.ok)throw Error('进入失败，请刷新重试');const s=await r.json();for(const k of ['authToken','userEmail','isAdmin','userPlan'])localStorage.removeItem(k);localStorage.setItem('authToken',s.token);localStorage.setItem('userEmail',s.email);location.assign('/');}catch(e){document.querySelector('#status').textContent=e.message;document.querySelectorAll('button').forEach(b=>b.disabled=false);}});
</script></html>
