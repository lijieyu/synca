server {
    listen 172.26.29.139:80;
    server_name synca-preview.haerth.cn;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/synca-preview-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 172.26.29.139:443 ssl;
    server_name synca-preview.haerth.cn;
    ssl_certificate /etc/letsencrypt/live/synca-preview.haerth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synca-preview.haerth.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    client_max_body_size 210m;
    client_body_timeout 900s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    location = /__preview/unlock {
        auth_basic "Synca preview";
        auth_basic_user_file /opt/synca-preview/access.htpasswd;
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Preview-Authenticated 1;
    }
    location / {
        proxy_set_header X-Preview-Authenticated "";
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
