name: Windows distribution verification
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.gitattributes'
      - 'desktop/**'
      - 'web/**'
      - 'backend/tests/acceptance-server.ts'
      - '.github/workflows/windows-distribution.yml'
permissions:
  contents: read
concurrency:
  group: windows-distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: pwsh
    env:
      SYNCA_WINDOWS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
            backend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix backend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows contract and security regression
        working-directory: desktop
        run: node --test update-policy.test.cjs updater.test.cjs windows-distribution.test.cjs store-manifest.test.cjs windows-compat.test.cjs capture.test.cjs
      - name: Build website app and installer
        working-directory: desktop
        run: |
          npm run build:windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node build-windows-installer.mjs $env:SYNCA_WINDOWS_ARCH
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Get-Content app/package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist/Synca Electron-win32-$env:SYNCA_WINDOWS_ARCH" -DestinationPath "dist/Synca-$version-Windows-$env:SYNCA_WINDOWS_ARCH.zip"
      - name: Build unsigned Store CI package (not a submission)
        working-directory: desktop
        run: |
          $sdk = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Directory | Where-Object { Test-Path "$($_.FullName)/x64/makeappx.exe" } | Sort-Object Name -Descending | Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK missing' }
          $env:WINDOWS_KIT_PATH = "$($sdk.FullName)/x64"
          node build.mjs win32 store
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node build-windows-msix.mjs $env:SYNCA_WINDOWS_ARCH --ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real Windows x64 migration and UI evidence
        if: matrix.arch == 'x64'
        working-directory: desktop
        run: node windows-acceptance.mjs
      - name: Upload evidence and packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synca-1.2.1-windows-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/dist/*.zip
            desktop/dist/updates/**
            desktop/dist/store/**/Synca*.msix
            desktop/dist/store/**/AppxManifest.xml
            desktop/dist/store/**/build-evidence.json
            desktop/dist/evidence/**
