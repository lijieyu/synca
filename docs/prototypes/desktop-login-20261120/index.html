<header class="tools"><strong>Synca · 登录交互稿</strong><span class="badge">仅模拟交互，不发送邮件或登录真实账号</span><span class="grow"></span><div class="seg" aria-label="窗口尺寸"><button data-size="normal" aria-pressed="true">常规桌面</button><button data-size="min" aria-pressed="false">640 × 500</button></div><button class="small" id="theme">深色</button><button class="small" id="platform">Web 外观</button></header>

<script>
const $=s=>document.querySelector(s);const apple='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c.02 3.23 2.83 4.3 2.86 4.31-.02.08-.45 1.54-1.48 3.05-.9 1.3-1.83 2.6-3.3 2.62-1.44.03-1.9-.85-3.55-.85-1.64 0-2.15.82-3.51.88-1.42.05-2.5-1.41-3.4-2.7C2.83 17.2 1.41 12.36 3.3 9.08c.94-1.63 2.62-2.67 4.44-2.7 1.39-.03 2.7.94 3.55.94.84 0 2.43-1.17 4.1-1 .69.03 2.63.28 3.87 2.1-.1.06-2.31 1.35-2.29 4.12h.08zM14.36 4.52c.75-.91 1.25-2.17 1.11-3.43-1.08.04-2.39.72-3.17 1.63-.69.8-1.3 2.08-1.14 3.3 1.21.09 2.44-.62 3.2-1.5z"/></svg>';const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13"/></svg>';const mail='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>';const check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';

function render(){let s='';$('#sim').innerHTML='';const binding=state.purpose==='bind';const accountMode=state.page==='account'||state.page==='link-success'||(binding&&['email','code'].includes(state.page))||(state.page==='apple'&&state.appleReturn==='account');$('#window').classList.toggle('account-mode',accountMode);$('.hero').innerHTML=accountMode?'<h2>设置</h2><nav class="settings-nav" aria-label="设置栏目示意"><div class="selected">账号与套餐<small>Synca Pro · 终身版</small></div><div>通用</div><div>分类管理</div><div>连接 AI</div><div>提交反馈</div><div>关于</div></nav>':heroInitial;
if(state.page==='welcome')s=`<div class="topline"></div><div class="compact-logo wordmark"><img src="logo.png" alt="">Synca</div><div class="eyebrow">欢迎使用 Synca</div><h1 tabindex="-1">让记录，跟上你的灵感。</h1><p class="description">登录后，在你的设备之间同步内容。</p><button class="primary" id="apple-start">${apple}通过 Apple 继续</button><p class="apple-note">使用现有 Apple 账号，快速开始</p><div class="divider">或</div><button class="secondary" id="email-start">${mail}使用邮箱</button><div id="notice" class="notice status" role="status"></div>${terms}`;

if(state.page==='apple'){s=`${back(state.appleReturn,'取消')}<div class="round" style="color:var(--ink)">${apple}</div><h1 tabindex="-1">${state.appleNext==='email'?'确认是你本人':'通过 Apple 继续'}</h1><p class="description">请在 Apple 授权窗口中完成登录。<br>完成后，会自动回到 Synca。</p>${state.appleNext==='link-success'?'<div class="callout"><strong>绑定到你的原账号</strong>登录成功后，将已验证的邮箱绑定到该账号，记录和套餐保持不变。</div>':''}<div class="spacer"></div><button class="secondary" id="apple-retry">重新打开 Apple 登录</button><p class="hint">若未看到授权窗口，请检查浏览器是否拦截弹窗。</p>`;$('#sim').innerHTML='<span>授权结果：</span><button class="small" id="apple-ok">模拟成功</button><button class="small" id="apple-cancel">模拟取消</button>';}

if(state.page==='account')s=`<div class="topline"></div><div class="eyebrow">设置 / 账号与套餐</div><h1 tabindex="-1">登录方式</h1><p class="description">为同一个账号添加另一种登录方式。</p><div class="account-card"><div class="row"><div class="label"><strong>Synca 用户</strong><small>示例 Apple 账号</small></div><span class="pill">Synca Pro</span></div><div class="row">${apple}<div class="label"><strong>Apple</strong><small>已连接</small></div></div><div class="row">${mail}<div class="label"><strong>邮箱</strong><small>${state.bound?esc(state.bound):'未添加'}</small></div>${state.bound?'<span class="pill">已验证</span>':'<button class="link" id="add-email">添加</button>'}</div></div><p class="hint">登录方式不同，记录与套餐相同。</p>`;
if(state.page==='success'||state.page==='link-success'){const linked=state.page==='link-success';s=`<div class="topline"></div><div class="round">${check}</div><h1 tabindex="-1">${linked?'邮箱已绑定':'已登录 Synca'}</h1><p class="description">${linked?'以后可以通过 Apple 或 '+esc(state.email)+' 登录同一个账号。':'登录流程已完成，可以开始记录了。'}</p>${linked?'<div class="callout"><strong>原来的记录与套餐都在</strong>这次只增加了登录方式，没有创建新账号。</div>':''}<div class="spacer"></div><button class="primary" id="done">${linked?'返回账号设置':'进入 Synca'}</button><p class="hint">交互稿中的成功结果为模拟，不会建立真实会话。</p>`;}
if(state.page==='home')s=`<div class="compact-logo wordmark"><img src="logo.png" alt="">Synca</div><h1 tabindex="-1">准备好记下第一个想法。</h1><p class="description">这里代表成功进入主界面。</p><div class="sample" style="transform:none;margin:10px 0 26px"><div class="tiny"><i class="dot"></i> 交互稿示例</div><h3>想到什么，就先记下来。</h3><p>登录方式改变，记录习惯不变。</p></div><button class="secondary" id="restart">再体验一次</button>`;
$('#stage').innerHTML=`<div class="content ${state.page==='welcome'?'welcome':''}">${s}</div>`;$('#stage').scrollTop=0;bind();tick();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#apple-start')?.addEventListener('click',()=>appleStart('success','welcome'));$('#email-start')?.addEventListener('click',()=>{state.purpose='login';go('email');});$('#apple-bind')?.addEventListener('click',()=>{state.email=$('#email').value;appleStart('email','email');});$('#connect-old')?.addEventListener('click',()=>appleStart('link-success','new'));$('#create')?.addEventListener('click',()=>go('success'));$('#add-email')?.addEventListener('click',()=>{state.purpose='bind';state.email='';appleStart('email','account');});$('#apple-retry')?.addEventListener('click',()=>{notice('');$('#apple-retry').textContent='已重新打开授权窗口';});$('#apple-ok')?.addEventListener('click',()=>{if(state.appleNext==='email')state.purpose='bind';if(state.appleNext==='link-success'){state.bound=state.email;state.purpose='bind';}go(state.appleNext);});$('#apple-cancel')?.addEventListener('click',()=>{go(state.appleReturn);notice('已取消 Apple 登录，你可以重试或选择邮箱。',true);});$('#done')?.addEventListener('click',()=>go(state.page==='link-success'?'account':'home'));$('#restart')?.addEventListener('click',()=>go('welcome'));
$('#email-form')?.addEventListener('submit',e=>{e.preventDefault();state.email=$('#email').value.trim();const input=$('#email');if(!input.validity.valid||!state.email){input.setAttribute('aria-invalid','true');notice('请输入有效的邮箱地址。');input.focus();return;}input.removeAttribute('aria-invalid');send(false);});$('#email')?.addEventListener('input',()=>{state.email=$('#email').value;notice('');$('#email').removeAttribute('aria-invalid');});$('#code')?.addEventListener('input',()=>{const c=$('#code');c.value=c.value.replace(/\D/g,'').slice(0,6);c.removeAttribute('aria-invalid');notice('');});$('#code-form')?.addEventListener('submit',async e=>{e.preventDefault();if(state.busy)return;const code=$('#code');if(code.value.length!==6){notice('请输入 6 位验证码。');code.setAttribute('aria-invalid','true');code.focus();return;}if(state.attempts>=5){notice('尝试次数过多，请稍后重新获取验证码。');return;}if(state.scenario==='expired'){notice('验证码已过期，请重新获取。');state.until=0;tick();return;}if(code.value!=='123456'){state.attempts++;notice('验证码不正确，请重新输入。');code.setAttribute('aria-invalid','true');code.select();return;}if(state.purpose==='bind'&&state.scenario==='conflict'){notice('这个邮箱已用于另一个 Synca 账号。请更换邮箱；不同账号不会自动合并。');return;}state.busy=true;$('#verify').disabled=true;$('#verify').textContent='正在验证…';const token=state.token;await new Promise(r=>setTimeout(r,350));if(token!==state.token)return;if(state.purpose==='bind'){state.bound=state.email;go('link-success');}else go(state.scenario==='existing'?'success':'new');});$('#resend')?.addEventListener('click',()=>send(true));}
async function send(resend){if(state.busy)return;if(resend&&Date.now()<state.until)return;state.busy=true;const button=resend?$('#resend'):$('#send');button.disabled=true;button.textContent='正在发送…';notice('');const token=state.token;await new Promise(r=>setTimeout(r,350));if(token!==state.token)return;state.busy=false;if(state.scenario==='sendfail'||state.scenario==='limited'){notice(state.scenario==='sendfail'?'暂时无法发送验证码，请稍后重试。':'发送过于频繁，请稍后再试。');button.disabled=false;button.textContent=resend?'重新发送':'发送验证码';return;}state.until=Date.now()+60000;state.attempts=0;if(resend&&state.scenario==='expired'){state.scenario='normal';$('#scenario').value='normal';}go('code');if(resend)notice('新的验证码已发送，请使用最新一封邮件中的验证码。',true);}
function tick(){const b=$('#resend');if(!b)return;const left=Math.max(0,Math.ceil((state.until-Date.now())/1000));b.disabled=left>0||state.busy;b.textContent=left?`${left} 秒后重新发送`:'重新发送';}
setInterval(tick,1000);$('#theme').onclick=()=>{document.body.classList.toggle('dark');$('#theme').textContent=document.body.classList.contains('dark')?'浅色':'深色';};$('#platform').onclick=()=>{$('#window').classList.toggle('web');$('#platform').textContent=$('#window').classList.contains('web')?'Electron 外观':'Web 外观';};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{$('#window').classList.toggle('min',b.dataset.size==='min');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});$('#login-path').onclick=()=>{state.purpose='login';go('welcome');$('#login-path').setAttribute('aria-pressed','true');$('#account-path').setAttribute('aria-pressed','false');};$('#account-path').onclick=()=>{state.purpose='bind';state.bound='';go('account');$('#login-path').setAttribute('aria-pressed','false');$('#account-path').setAttribute('aria-pressed','true');};$('#scenario').onchange=e=>{state.scenario=e.target.value;notice('');};render();
</script></body></html>
